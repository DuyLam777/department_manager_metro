services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metro-dept-backend
    ports:
      - "8000:8000"
    volumes:
      - metro_dept_db:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/metro_dept.db
    networks:
      - metro-dept-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metro-dept-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - metro-dept-network
    restart: unless-stopped

networks:
  metro-dept-network:
    driver: bridge

volumes:
  metro_dept_db:
